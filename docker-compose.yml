services:
  db:
    image: postgres:17-alpine
    container_name: audio-book-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-audiobookdb}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-audiobookdb}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: audio-book-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-development}
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: ${SERVER_PORT:-8080}
      SERVER_READ_TIMEOUT: ${SERVER_READ_TIMEOUT:-300s}
      SERVER_WRITE_TIMEOUT: ${SERVER_WRITE_TIMEOUT:-300s}
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-audiobookdb}?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-supersecretkey}
      GOOGLE_BOOKS_API_KEY: ${GOOGLE_BOOKS_API_KEY:-}
      NO_PROXY: www.googleapis.com,googleapis.com
      no_proxy: www.googleapis.com,googleapis.com
    volumes:
      - audio_files:/app/static/audio
    ports:
      - "${SERVER_PORT:-8080}:8080"

volumes:
  postgres_data:
  audio_files:

